{% set name = "osdagbridge" %}
{% set version = "1.0.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  number: 1

  script: |
    {{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv

  entry_points:
    - osdagbridge=osdagbridge.desktop.__main__:main
    - osdagbridge-cli=osdagbridge.cli.__main__:main

  post-link: post-link.bat
  pre-unlink: pre-unlink.bat


requirements:
  host:
    - python >=3.11,<3.13
    - pip
    - setuptools
    - wheel
  run:
    - python >=3.11,<3.13
    - fiona
    - shapely
    - scipy>=1.10.1
    - pydantic
    - xarray
    - osdag


test:
  commands:
    - python -c "import osdagbridge"
    - python -c "import PySide6"
about:
  summary: "Osdag bridge environment with PySide6 via pip"

extra:
  recipe-maintainers:
    - garvit000
    