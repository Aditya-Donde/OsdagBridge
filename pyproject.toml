[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osdagbridge"
version = "1.0.0"
description = "OsdagBridge - Shared core for analysis and design of steel bridges (CLI, Desktop, Web)"
readme = "README.md"
license = { file = "LICENSE" }

authors = [
  { name = "Osdag", email = "contact-osdag@fossee.in" }
]

requires-python = ">=3.11,<3.13"

keywords = [
  "bridge",
  "steel",
  "structural engineering",
  "analysis",
  "IRC",
  "IS 800",
  "Osdag"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering",
]

# Runtime dependencies

dependencies = [
  "scipy>=1.10.1",
  "fiona",
  "shapely",
  "pydantic>=2.0",
  "matplotlib>=3.5",
  "openseespy>=3.2.2.6",
  "opsvis>=1.0",
  "xarray",
]

[project.optional-dependencies]
test = [
  "pytest>=6.2.2",
]

dev = [
  "pytest>=6.2.2",
]

# Package data
[tool.setuptools.package-data]
osdagbridge = [
  "core/data/**/*",
  "core/reports/templates/**/*",
  "desktop/resources/**/*",
]

# setuptools config
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Entry points
[project.scripts]
osdagbridge-cli = "osdagbridge.cli.__main__:main"
osdagbridge = "osdagbridge.desktop.__main__:main"
