<!DOCTYPE html>
<html>

<head>
    <title>Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            background-color: #ffe0e0;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #444;
        }
    </style>
</head>

<body>
    <div id="map">Loading OpenStreetMap... (Requires Internet)</div>
    <script>
        // Default to center of India
        var map = L.map('map').setView([20.5937, 78.9629], 5);
        var marker;

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // Setup QWebChannel
        new QWebChannel(qt.webChannelTransport, function (channel) {
            window.bridge = channel.objects.bridge;
        });

        function updateMarker(lat, lng) {
            if (marker) {
                map.removeLayer(marker);
            }
            marker = L.marker([lat, lng]).addTo(map);
        }

        map.on('click', function (e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;

            updateMarker(lat, lng);

            if (window.bridge) {
                window.bridge.onLocationSelected(lat, lng);
            }
        });

        // Function to be called from Python to set initial/current location
        function setLocation(lat, lng, zoom) {
            map.setView([lat, lng], zoom || 10);
            updateMarker(lat, lng);
        }
    </script>
</body>

</html>
